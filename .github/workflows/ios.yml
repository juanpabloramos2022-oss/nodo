name: ios

# Compila la app y publica un .ipa SIN firmar como artifact descargable.
# La firma se hace despues, fuera de GitHub, con el certificado de quien instala.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Pruebas del nucleo
        run: swift test

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto Xcode
        run: xcodegen generate

      - name: Compilar sin firma
        run: |
          xcodebuild \
            -project Nodo.xcodeproj \
            -scheme Nodo \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar el .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Nodo.app Payload/
          zip -qr Nodo.ipa Payload
          ls -lh Nodo.ipa

      - name: Publicar el .ipa
        uses: actions/upload-artifact@v5
        with:
          name: Nodo-ipa
          path: Nodo.ipa
          retention-days: 30
