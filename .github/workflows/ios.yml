name: ios

# Compila la app y publica un .ipa SIN firmar como artifact descargable.
# La firma se hace despues, fuera de GitHub, con el certificado de quien instala.
# El job `capturas` ademas arranca la app en el simulador y publica los PNG de
# verificacion visual que exige la SPEC (seccion 6, H7).

on:
  push:
    branches: [main, feat/gran-avance, feat/v031-correccion, feat/v031-paralela, feat/v032]
  pull_request:
  workflow_dispatch:
    inputs:
      fase:
        description: "Fase para nombrar el artefacto de capturas (por defecto: actual)"
        required: false
        default: "actual"
        type: string

jobs:
  # CI en dos velocidades (metodo aprobado 23-oct): los commits intermedios de
  # una partida llevan el marcador [solo-tests] en el mensaje y corren solo
  # este job (swift test + NodoAppTests). La corrida completa `compilar`
  # (tests + build + IPA) se exige solo en el commit de cierre de partida.
  tests:
    if: ${{ contains(github.event.head_commit.message, '[solo-tests]') }}
    runs-on: macos-15
    # Necesario para dejar el log de las pruebas en la rama `capturas` cuando
    # fallan: es la unica evidencia de diagnostico si el runner no publica el
    # xcresult.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Pruebas del nucleo
        run: swift test

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto Xcode
        run: xcodegen generate

      - name: Pruebas de la app (NodoAppTests)
        run: |
          if ! xcrun simctl list devices available | grep -q "iPhone 16 ("; then
            RUNTIME=$(xcrun simctl list runtimes | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]+' | tail -1)
            xcrun simctl create "iPhone 16" com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$RUNTIME" || true
          fi
          xcrun simctl boot "iPhone 16" 2>/dev/null || true
          xcrun simctl bootstatus booted -b || true
          # El log se guarda con tee para poder diagnosticar un fallo desde la
          # rama capturas; pipefail mantiene el fallo de los tests como fallo.
          set -o pipefail
          xcodebuild test \
            -project Nodo.xcodeproj \
            -scheme Nodo \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:NodoAppTests \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee xcodebuild-tests.log

      # Diagnostico: si las pruebas de la app fallan, el log completo queda en
      # la rama `capturas` bajo tests-<sha7>/, revisable sin permisos de
      # artefactos. No cambia el resultado del job.
      - name: Publicar el log de pruebas si fallan
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf pub
          if git clone --depth 1 --branch capturas \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pub 2>/dev/null; then
            echo "Rama capturas existente."
          else
            mkdir pub && (cd pub && git init -q -b capturas .)
          fi
          DEST="pub/tests-${GITHUB_SHA::7}"
          mkdir -p "$DEST"
          cp xcodebuild-tests.log "$DEST/" 2>/dev/null || true
          cd pub
          git config user.name "nodo-ci"
          git config user.email "ci@localhost"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada nuevo que publicar."
            exit 0
          fi
          git commit -q -m "tests ${GITHUB_SHA::7}"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" capturas

  compilar:
    if: ${{ !contains(github.event.head_commit.message, '[solo-tests]') }}
    runs-on: macos-15
    # Necesario para publicar las trazas de vista en la rama `capturas` (mismo
    # motivo que el job `capturas`): la evidencia debe estar en git para
    # revisarla sin permisos de artefactos.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Pruebas del nucleo
        run: swift test

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto Xcode
        run: xcodegen generate

      # Las pruebas de la app van antes de compilar el .ipa: si fallan, el job
      # se corta y no se publica un binario roto.
      - name: Pruebas de la app (NodoAppTests)
        run: |
          # El job compilar nunca habia corrido tests de simulador: en un
          # runner frio el dispositivo puede no existir todavia. Se crea si
          # falta y se arranca antes de probar, como hace el job capturas.
          if ! xcrun simctl list devices available | grep -q "iPhone 16 ("; then
            RUNTIME=$(xcrun simctl list runtimes | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]+' | tail -1)
            xcrun simctl create "iPhone 16" com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$RUNTIME" || true
          fi
          xcrun simctl boot "iPhone 16" 2>/dev/null || true
          xcrun simctl bootstatus booted -b || true
          # El log se guarda con tee para poder extraer las trazas de vista
          # (las imprime TrazaVistaTest a stdout); pipefail mantiene el fallo
          # de los tests como fallo del paso.
          set -o pipefail
          xcodebuild test \
            -project Nodo.xcodeproj \
            -scheme Nodo \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:NodoAppTests \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee xcodebuild-tests.log

      # Puerta B de P0: las trazas de vista que imprimen los tests se extraen
      # del log y se publican como artefacto y en la rama `capturas`, para que
      # la revision no dependa de abrir el .xcresult.
      - name: Extraer trazas de vista
        if: always()
        run: python3 herramientas/extraer-trazas.py xcodebuild-tests.log trazas

      - name: Publicar las trazas
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trazas-${{ github.sha }}
          path: trazas/
          if-no-files-found: error

      - name: Publicar trazas en la rama capturas
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Misma publicacion que el job `capturas`: cada corrida deja una
          # carpeta trazas-<sha corto>/ en la rama `capturas`. Diferencia
          # exigida: si los 3 intentos fallan, el paso FALLA (la evidencia
          # tiene que estar en git para revisarla sin permisos de artefactos).
          publicar() {
            rm -rf pub
            if git clone --depth 1 --branch capturas \
                "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pub 2>/dev/null; then
              echo "Rama capturas existente."
            else
              mkdir pub && (cd pub && git init -q -b capturas .)
              echo "Rama capturas creada como huerfana."
            fi
            DEST="pub/trazas-${GITHUB_SHA::7}"
            mkdir -p "$DEST"
            cp trazas/*.txt "$DEST/" 2>/dev/null || echo "Sin trazas en esta corrida."
            cd pub
            git config user.name "nodo-ci"
            git config user.email "ci@localhost"
            git add -A
            if git diff --cached --quiet; then
              echo "Nada nuevo que publicar."
              cd ..
              return 0
            fi
            git commit -q -m "trazas ${GITHUB_SHA::7}"
            git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" capturas
          }
          publicar || { sleep 10; publicar; } || { sleep 20; publicar; } || {
            echo "No se pudo publicar las trazas en la rama capturas tras 3 intentos."
            exit 1
          }

      - name: Compilar sin firma
        run: |
          xcodebuild \
            -project Nodo.xcodeproj \
            -scheme Nodo \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Puerta de cierre (coherencia de version)
        run: python3 herramientas/verificar-cierre.py --solo-repo

      - name: Empaquetar el .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Nodo.app Payload/
          zip -qr Nodo.ipa Payload
          ls -lh Nodo.ipa

      - name: Publicar el .ipa
        uses: actions/upload-artifact@v5
        with:
          name: Nodo-ipa
          path: Nodo.ipa
          retention-days: 30

      # Publica la IPA de la version en la rama `capturas`, bajo ipa/. Solo
      # corre en main (nunca en una rama de trabajo) y no puede enrojecer la
      # rama: un fallo de publicacion se queda como aviso del paso.
      - name: Publicar la IPA en la rama capturas
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Mismo patron que la publicacion de trazas: clonar `capturas` o
          # crearla huerfana, copiar el binario, commit y push con reintentos.
          publicar() {
            rm -rf pub
            if git clone --depth 1 --branch capturas \
                "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pub 2>/dev/null; then
              echo "Rama capturas existente."
            else
              mkdir pub && (cd pub && git init -q -b capturas .)
              echo "Rama capturas creada como huerfana."
            fi
            DEST="pub/ipa"
            mkdir -p "$DEST"
            cp Nodo.ipa "$DEST/Nodo-v0.3.2.ipa"
            cd pub
            git config user.name "nodo-ci"
            git config user.email "ci@localhost"
            git add -A
            if git diff --cached --quiet; then
              echo "Nada nuevo que publicar."
              cd ..
              return 0
            fi
            git commit -q -m "ipa v0.3.2 ${GITHUB_SHA::7}"
            git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" capturas
          }
          publicar || { sleep 10; publicar; } || { sleep 20; publicar; } || {
            echo "No se pudo publicar la IPA en la rama capturas tras 3 intentos."
            exit 1
          }

  # Job independiente: si falla una captura, `compilar` sigue publicando el
  # .ipa igual que antes. Solo corre el target NodoCapturas, no `swift test`.
  # Ademas del artefacto, publica los PNG y el log en la rama `capturas`:
  # la revision visual de la SPEC seccion 6 se hace leyendo esa rama, sin
  # depender de descargar artefactos con permisos de administrador.
  capturas:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto Xcode
        run: xcodegen generate

      - name: Preparar el simulador
        run: |
          # En CI no hay teclado fisico: el simulador debe mostrar el teclado
          # en pantalla para que las capturas de la Fase 1 lo incluyan.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false || true
          xcrun simctl boot "iPhone 16" 2>/dev/null || true
          xcrun simctl bootstatus booted -b || true

      - name: Capturas del simulador
        run: |
          rm -rf capturas.xcresult capturas
          set -o pipefail
          xcodebuild test \
            -project Nodo.xcodeproj \
            -scheme Capturas \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:NodoCapturas \
            -parallel-testing-enabled NO \
            -resultBundlePath capturas.xcresult \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee xcodebuild-capturas.log

      - name: Extraer los PNG del .xcresult
        if: always()
        run: python3 herramientas/extraer-capturas.py capturas.xcresult capturas

      - name: Publicar las capturas
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: capturas-${{ github.event.inputs.fase || 'actual' }}
          path: capturas/
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar capturas y log en la rama capturas
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FASE: ${{ github.event.inputs.fase || 'actual' }}
        run: |
          # Rama de solo capturas: cada corrida deja una carpeta
          # <fase>-<sha corto>/ con los PNG y el log completo de xcodebuild,
          # para que la revision visual y el diagnostico se hagan con git.
          # Si dos corridas publican a la vez, el push perdedor se reintenta
          # clonando de nuevo: publicar nunca debe tumbar el job.
          publicar() {
            rm -rf pub
            if git clone --depth 1 --branch capturas \
                "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pub 2>/dev/null; then
              echo "Rama capturas existente."
            else
              mkdir pub && (cd pub && git init -q -b capturas .)
              echo "Rama capturas creada como huerfana."
            fi
            DEST="pub/${FASE}-${GITHUB_SHA::7}"
            mkdir -p "$DEST"
            # El log se copia PRIMERO y sin condicion: es la evidencia de
            # diagnostico cuando los tests fallan y no hay ningun PNG.
            cp xcodebuild-capturas.log "$DEST/" 2>/dev/null || echo "Sin log en esta corrida."
            cp capturas/*.png "$DEST/" 2>/dev/null || echo "Sin PNG en esta corrida."
            # Los adjuntos de texto (jerarquia de accesibilidad de los tests)
            # viajan con las capturas para diagnosticar sin bajar artefactos.
            cp capturas/*.txt "$DEST/" 2>/dev/null || echo "Sin TXT en esta corrida."
            cd pub
            git config user.name "nodo-ci"
            git config user.email "ci@localhost"
            git add -A
            if git diff --cached --quiet; then
              echo "Nada nuevo que publicar."
              cd ..
              return 0
            fi
            git commit -q -m "capturas ${FASE} ${GITHUB_SHA::7}"
            git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" capturas
          }
          publicar || { sleep 10; publicar; } || { sleep 20; publicar; } || echo "Publicacion omitida tras 3 intentos; el artefacto sigue disponible."
