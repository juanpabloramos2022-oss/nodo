# Definicion del proyecto Xcode, en texto.
#
# Motivo: un .xcodeproj es un arbol de archivos que solo Xcode sabe generar bien.
# Manteniendolo como YAML, el proyecto se crea en cualquier maquina con
# `xcodegen generate` y no hay que versionar nada generado.
#
# `xcodegen generate` produce Nodo.xcodeproj y Nodo/Info.plist. Ambos estan en
# .gitignore a proposito.

name: Nodo

options:
  bundleIdPrefix: com.nodo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  NodoCore:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Compilacion sin firma: el .ipa se firma despues, fuera de la cadena de
    # compilacion, con el certificado de quien lo instala.
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  Nodo:
    type: application
    platform: iOS
    sources:
      - path: Nodo
        excludes:
          - "Info.plist"
    # El nucleo es un paquete Swift local. Asi el mismo codigo que corre
    # `swift test` es el que se compila dentro de la app, sin copiarlo.
    dependencies:
      - package: NodoCore
      - sdk: Speech.framework
      - sdk: AVFoundation.framework
    info:
      path: Nodo/Info.plist
      properties:
        CFBundleDisplayName: Nodo
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "4"
        CFBundleIconName: AppIcon
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Dark
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # Textos genericos de los permisos del dictado (§4.5). No describen
        # datos de nadie: solo dicen para que usa Nodo el microfono.
        NSMicrophoneUsageDescription: "Nodo usa el micrófono para dictar mensajes por voz."
        NSSpeechRecognitionUsageDescription: "Nodo usa el reconocimiento de voz para convertir tu dictado en texto."
        # Permite hablar con un servidor de modelos en la red local por http.
        # Todo lo que sale a internet sigue exigiendo https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nodo.ios
        PRODUCT_NAME: Nodo
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "4"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO

  # Target de UI tests que arranca la app en el simulador y adjunta un PNG por
  # captura. No cambia el bundle id ni la version de la app: es un bundle de
  # pruebas aparte, con su propio identificador.
  NodoCapturas:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NodoCapturas
    dependencies:
      - target: Nodo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nodo.ios.capturas
        PRODUCT_NAME: NodoCapturas
        TEST_TARGET_NAME: Nodo
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        # Misma version que la app, solo para el Info.plist del bundle de tests.
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "4"

  # Target de pruebas unitarias de la capa app. Usa la app como host para que
  # `@testable import Nodo` vea el estado y las vistas reales, y corre en el
  # simulador igual que las capturas.
  NodoAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NodoAppTests
    dependencies:
      - target: Nodo
      # Las pruebas tambien usan tipos del nucleo (AlmacenClaves, HTTPStreaming,
      # RespaldoConfiguracion), asi que se enlaza el paquete explicitamente.
      - package: NodoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nodo.ios.apptests
        PRODUCT_NAME: NodoAppTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        # La app es el host: sin estas dos rutas XCTest no puede cargar el
        # modulo Nodo ni ejecutar el bundle en el simulador.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nodo.app/Nodo"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # Misma version que la app, solo para el Info.plist del bundle de tests.
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "4"

schemes:
  Nodo:
    build:
      targets:
        Nodo: all
        NodoAppTests: [test]
    run:
      config: Release
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - NodoAppTests

  # Esquema propio para que `xcodebuild test` corra SOLO las capturas, sin
  # mezclarlas con la compilacion de la app que publica el .ipa.
  Capturas:
    build:
      targets:
        Nodo: all
        NodoCapturas: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NodoCapturas
