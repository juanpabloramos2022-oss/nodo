# Definicion del proyecto Xcode, en texto.
#
# Motivo: un .xcodeproj es un arbol de archivos que solo Xcode sabe generar bien.
# Manteniendolo como YAML, el proyecto se crea en cualquier maquina con
# `xcodegen generate` y no hay que versionar nada generado.
#
# `xcodegen generate` produce Nodo.xcodeproj y Nodo/Info.plist. Ambos estan en
# .gitignore a proposito.

name: Nodo

options:
  bundleIdPrefix: com.nodo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  NodoCore:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Compilacion sin firma: el .ipa se firma despues, fuera de la cadena de
    # compilacion, con el certificado de quien lo instala.
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  Nodo:
    type: application
    platform: iOS
    sources:
      - path: Nodo
        excludes:
          - "Info.plist"
    # El nucleo es un paquete Swift local. Asi el mismo codigo que corre
    # `swift test` es el que se compila dentro de la app, sin copiarlo.
    dependencies:
      - package: NodoCore
    info:
      path: Nodo/Info.plist
      properties:
        CFBundleDisplayName: Nodo
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "2"
        CFBundleIconName: AppIcon
        LSRequiresIPhoneOS: true
        UIUserInterfaceStyle: Dark
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # Permite hablar con un servidor de modelos en la red local por http.
        # Todo lo que sale a internet sigue exigiendo https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nodo.ios
        PRODUCT_NAME: Nodo
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO

schemes:
  Nodo:
    build:
      targets:
        Nodo: all
    run:
      config: Release
    archive:
      config: Release
